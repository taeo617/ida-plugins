description: >
  선택한 객체를 Make2D로 탑뷰·정면·우측면 등 원하는 뷰와 3D(등각) 뷰로 만들어 전체·지름 치수를 넣고,
  삼면도는 3각법으로 한 장에, 또는 뷰마다 한 장씩 A4 도곽에 실제 축척으로 배치해 SVG, AI, 바로 인쇄할 PDF로 내보냅니다.
  A4Drawing을 실행하면 설정 창이 뜹니다. 고친 뒤 다시 내보내기 A4DrawingExport.
